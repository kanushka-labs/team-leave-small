openapi: 3.0.3
info:
  title: Team Leave API
  version: 0.1.0
servers:
  - url: /
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            leave-requests:read: The caller's own leave requests
            leave-requests:submit: Create a new leave request
            leave-requests:cancel: Cancel the caller's own pending request
            leave-requests:review-team: View the caller's team's leave requests
            leave-requests:approve: Approve a pending request from the caller's team
            leave-requests:reject: Reject a pending request from the caller's team
            leave-balances:read: The caller's own leave balances
            leave-balances:review-team: View the caller's team's leave balances
            leave-balances:adjust: Set or adjust a team member's leave balance
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
    LeaveType:
      type: string
      enum: [Vacation, Sick, Personal]
    LeaveRequestStatus:
      type: string
      enum: [pending, approved, rejected]
    LeaveRequest:
      type: object
      required: [id, employeeId, type, startDate, endDate, reason, status]
      properties:
        id: { type: string }
        employeeId: { type: string }
        type: { $ref: '#/components/schemas/LeaveType' }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        reason: { type: string }
        status: { $ref: '#/components/schemas/LeaveRequestStatus' }
        comment: { type: string, description: required on a rejection }
        decidedBy: { type: string, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
    NewLeaveRequest:
      type: object
      required: [type, startDate, endDate, reason]
      properties:
        type: { $ref: '#/components/schemas/LeaveType' }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        reason: { type: string }
    LeaveRequestDecision:
      type: object
      properties:
        comment: { type: string, description: required when rejecting }
    LeaveBalance:
      type: object
      required: [employeeId, type, balance]
      properties:
        employeeId: { type: string }
        type: { $ref: '#/components/schemas/LeaveType' }
        balance: { type: number }
    LeaveBalanceAdjustment:
      type: object
      required: [type, balance]
      properties:
        type: { $ref: '#/components/schemas/LeaveType' }
        balance: { type: number }
security:
  - oauth2: []
paths:
  /me/leave-requests:
    get:
      operationId: listMyLeaveRequests
      summary: The caller's leave requests, newest first
      security:
        - oauth2: [leave-requests:read]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/LeaveRequestStatus' }
      responses:
        '200':
          description: The caller's leave requests
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LeaveRequest' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: submitLeaveRequest
      summary: Submit a new leave request
      security:
        - oauth2: [leave-requests:submit]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewLeaveRequest' }
      responses:
        '201':
          description: The created request, pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequest' }
        '400':
          description: Invalid dates or missing fields
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/leave-requests/{requestId}:
    delete:
      operationId: cancelMyLeaveRequest
      summary: Cancel the caller's own request while it is still pending
      security:
        - oauth2: [leave-requests:cancel]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Cancelled
        '404':
          description: No such pending request for the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/leave-balances:
    get:
      operationId: listMyLeaveBalances
      summary: The caller's leave balance for each leave type
      security:
        - oauth2: [leave-balances:read]
      responses:
        '200':
          description: The caller's balances
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LeaveBalance' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/team/leave-requests:
    get:
      operationId: listTeamLeaveRequests
      summary: The caller's team's leave requests, oldest pending first
      security:
        - oauth2: [leave-requests:review-team]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/LeaveRequestStatus' }
      responses:
        '200':
          description: The caller's team's leave requests
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LeaveRequest' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/team/leave-requests/{requestId}/approve:
    post:
      operationId: approveTeamLeaveRequest
      summary: Approve a pending request from the caller's team
      security:
        - oauth2: [leave-requests:approve]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveRequestDecision' }
      responses:
        '200':
          description: Approved; the employee's balance is deducted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequest' }
        '400':
          description: The request is not pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such pending request on the caller's team
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/team/leave-requests/{requestId}/reject:
    post:
      operationId: rejectTeamLeaveRequest
      summary: Reject a pending request from the caller's team
      security:
        - oauth2: [leave-requests:reject]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveRequestDecision' }
      responses:
        '200':
          description: Rejected, with the manager's comment recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequest' }
        '400':
          description: The request is not pending, or no comment was given
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such pending request on the caller's team
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/team/leave-balances:
    get:
      operationId: listTeamLeaveBalances
      summary: The caller's team's leave balances
      security:
        - oauth2: [leave-balances:review-team]
      responses:
        '200':
          description: The caller's team's balances
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LeaveBalance' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/team/leave-balances/{employeeId}:
    put:
      operationId: adjustTeamMemberLeaveBalance
      summary: Set or adjust a team member's balance for one leave type
      security:
        - oauth2: [leave-balances:adjust]
      parameters:
        - name: employeeId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveBalanceAdjustment' }
      responses:
        '200':
          description: The updated balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveBalance' }
        '404':
          description: No such employee on the caller's team
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
